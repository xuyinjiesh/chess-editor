<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="棋局工坊 —— 自由设计棋盘、棋子与胜负规则的棋类游戏编辑器">
<title>棋局工坊 · 棋类游戏编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b63'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="edit">

<header class="topbar">
  <div class="brand">
    <span class="brand__mark">♞</span>
    <div class="brand__text">
      <b>棋局工坊</b>
      <small>棋类游戏编辑器</small>
    </div>
  </div>

  <input id="game-name" class="name-input" value="未命名棋局" maxlength="24" spellcheck="false" title="棋局名称">

  <div class="topbar__actions">
    <div class="seg" id="mode-seg">
      <button data-mode="edit" class="is-on" title="编辑模式">编辑</button>
      <button data-mode="play" title="对局模式：按规则走子并判定胜负">对局</button>
    </div>
    <button id="btn-undo" class="icon-btn" title="撤销 (Ctrl+Z)" disabled>↶</button>
    <button id="btn-redo" class="icon-btn" title="重做 (Ctrl+Shift+Z)" disabled>↷</button>
    <details class="menu">
      <summary class="btn">新建</summary>
      <div class="menu__body" id="template-menu"></div>
    </details>
    <details class="menu">
      <summary class="btn">导出</summary>
      <div class="menu__body">
        <button class="menu__item" data-export="json"><b>棋局文件 .json</b><small>保存全部棋盘、棋子与规则</small></button>
        <button class="menu__item" data-export="svg"><b>棋盘图片 .svg</b><small>矢量图，可直接放到文档里</small></button>
        <button class="menu__item" data-export="png"><b>棋盘图片 .png</b><small>2 倍分辨率位图</small></button>
        <button class="menu__item" data-export="copy"><b>复制 JSON</b><small>粘贴给别人或存进笔记</small></button>
      </div>
    </details>
    <button id="btn-import" class="btn">导入</button>
    <button id="btn-help" class="icon-btn" title="使用说明">?</button>
    <button id="btn-theme" class="icon-btn" title="切换明暗主题">☀</button>
  </div>
</header>

<main class="layout">
  <!-- 左侧：棋子库 + 棋子属性 -->
  <aside class="panel panel--left">
    <section class="card card--scroll">
      <header class="card__head">
        <h2>棋子库</h2>
        <span class="hint" id="brush-hint">画笔</span>
      </header>
      <div class="army-tabs" id="army-tabs"></div>
      <div class="palette" id="palette"></div>
      <div class="tools" id="tools"></div>
    </section>

    <section class="card card--scroll">
      <header class="card__head">
        <h2>棋子属性</h2>
        <button id="btn-new-type" class="btn btn--sm">新建棋子</button>
      </header>
      <div class="form" id="piece-form"></div>
    </section>
  </aside>

  <!-- 中间：棋盘 -->
  <section class="stage" id="stage">
    <div class="board-frame" id="board-frame">
      <div class="board" id="board">
        <div class="cells" id="cells"></div>
        <div class="pieces" id="pieces"></div>
      </div>
    </div>
    <div class="statusbar" id="statusbar"></div>
  </section>

  <!-- 右侧：棋盘 / 规则 / 对局 -->
  <aside class="panel panel--right">
    <nav class="tabs" id="right-tabs">
      <button data-tab="board" class="is-on">棋盘</button>
      <button data-tab="rules">规则</button>
      <button data-tab="play">对局</button>
    </nav>
    <div class="tabpanes" id="right-panes">
      <section class="card card--scroll" data-pane="board"><div class="form" id="board-form"></div></section>
      <section class="card card--scroll" data-pane="rules"><div class="form" id="wins-form"></div></section>
      <section class="card card--scroll" data-pane="play"><div class="form" id="play-panel"></div></section>
    </div>
  </aside>
</main>

<div class="toast-host" id="toast-host"></div>
<div class="modal-host" id="modal-host"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<script src="src/presets.js"></script>
<script src="src/model.js"></script>
<script src="src/rules.js"></script>
<script src="src/render.js"></script>
<script src="src/panels.js"></script>
<script src="src/app.js"></script>
</body>
</html>
